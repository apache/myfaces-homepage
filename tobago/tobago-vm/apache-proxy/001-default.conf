ServerName tobago-demo.apache.org

<VirtualHost *:80>

  ServerName tobago-demo.apache.org
  ServerAdmin dev@myfaces.apache.org

  ErrorLog ${APACHE_LOG_DIR}/error.log
  LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" cookie=\"%{Cookie}i\"" combined_with_cookie
  CustomLog ${APACHE_LOG_DIR}/access.log combined_with_cookie

  ErrorDocument 404 /error-404.html

  <Location /demo-6-snapshot/>
    ProxyPass "http://demo-6-snapshot:8080/demo-6-snapshot/"
    ProxyPassReverse "http://demo-6-snapshot:8080/demo-6-snapshot/"
  </Location>

  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/index\.html$
  RewriteCond %{REQUEST_URI} ^/demo-
  RewriteCond %{REQUEST_URI} !\.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|map)$ [NC]
  RewriteCond %{HTTP_COOKIE} !TOBAGO_BROWSER=1 [NC]
  RewriteRule ^ /index.html?url=%{REQUEST_URI} [R=302,L,NE]

</VirtualHost>
