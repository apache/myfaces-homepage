services:
  apache:
    container_name: apache
    build: apache-proxy
    ports:
      - "80:80"
      - "443:443"
    logging:
      options:
        max-size: "1m"
        max-file: "5"
    links:
      - demo-6-snapshot
#      - demo-4-snapshot
#      - demo-2-snapshot
    depends_on:
      - demo-6-snapshot
#      - demo-4-snapshot
#      - demo-2-snapshot
    restart: unless-stopped
  demo-6-snapshot:
    container_name: tobago-6
    image: tomcat:11-jdk25
    environment:
      - TOBAGO_VERSION=6.12.3-SNAPSHOT
      - CONTEXT_PATH=demo-6-snapshot
      - CATALINA_OPTS=-Xms1024m -Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC
    ports:
      - "8602:8080"
    volumes:
      - ./demo-6-snapshot.war:/usr/local/tomcat/webapps/demo-6-snapshot.war:ro
    logging:
      options:
        max-size: "1m"
        max-file: "5"
    restart: unless-stopped
